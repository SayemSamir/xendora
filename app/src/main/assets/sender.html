<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XENDORA Send</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #1b2a52 0%, #0b1020 60%, #05070d 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e5e7eb;
  }
  main {
    width: min(440px, 92vw); padding: 28px; border-radius: 22px;
    background: rgba(20, 27, 45, 0.75); border: 1px solid rgba(34, 211, 238, 0.35);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  h1 {
    margin: 0; font-size: 28px; letter-spacing: 1px;
    background: linear-gradient(90deg, #22d3ee, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { margin: 4px 0 18px; color: #94a3b8; font-size: 14px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-top: 16px; }
  input#code {
    width: 100%; margin-top: 6px; padding: 12px; font-size: 24px; letter-spacing: 6px;
    text-align: center; border-radius: 12px; border: 1px solid #334155;
    background: #0b1020; color: #e5e7eb;
  }
  input#file { width: 100%; margin-top: 6px; color: #cbd5e1; }
  button#send {
    margin-top: 20px; width: 100%; padding: 14px; border: 0; border-radius: 14px;
    font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  }
  button#send:disabled { opacity: 0.5; cursor: default; }
  .bar { margin-top: 18px; height: 8px; border-radius: 8px; background: #1e293b; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #3b82f6); transition: width 0.2s; }
  #status { margin-top: 12px; font-size: 14px; color: #94a3b8; min-height: 20px; white-space: pre-line; }
  #status.err { color: #f87171; }
</style>
</head>
<body>
<main>
  <h1>XENDORA</h1>
  <div class="tag">Universal File Transfer · Share Beyond Limits.</div>

  <label for="code">Receiver phone-e dekhano 6-digit code</label>
  <input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">

  <label for="file">File select korun</label>
  <input id="file" type="file">

  <button id="send" type="button">Pathan</button>

  <div class="bar"><div id="fill"></div></div>
  <div id="status"></div>
</main>

<script>
(function () {
  "use strict";

  function g(id) { return document.getElementById(id); }

  var codeInput = g("code");
  var fileInput = g("file");
  var sendBtn = g("send");
  var fill = g("fill");
  var status = g("status");

  function human(bytes) {
    var units = ["B", "KB", "MB", "GB", "TB"];
    var i = 0;
    var v = bytes;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v : v.toFixed(2)) + " " + units[i];
  }

  function setStatus(message, isError) {
    status.textContent = message;
    status.className = isError ? "err" : "";
  }

  codeInput.addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 6);
  });

  sendBtn.addEventListener("click", function () {
    var file = fileInput.files[0];
    var code = codeInput.value.trim();

    if (!/^\d{6}$/.test(code)) {
      setStatus("6-digit code din (receiver phone-e dekhabe).", true);
      return;
    }
    if (!file) {
      setStatus("Age file select korun.", true);
      return;
    }

    sendBtn.disabled = true;
    fill.style.width = "0%";
    setStatus("Pathano shuru hocche...", false);

    var started = Date.now();
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/upload", true);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.setRequestHeader("X-Pairing-Code", code);
    xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));

    // Real measured progress and speed, not estimates.
    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      var pct = e.loaded / e.total * 100;
      var secs = Math.max((Date.now() - started) / 1000, 0.001);
      var speed = e.loaded / secs;
      fill.style.width = pct.toFixed(1) + "%";
      setStatus(pct.toFixed(1) + "%  ·  " + human(e.loaded) + " / " + human(e.total) + "  ·  " + human(speed) + "/s", false);
    };

    xhr.onload = function () {
      sendBtn.disabled = false;
      if (xhr.status === 200) {
        fill.style.width = "100%";
        setStatus("Pathano hoyeche. Receiver phone-e file save hoyeche.", false);
      } else {
        fill.style.width = "0%";
        setStatus("Fail (" + xhr.status + "): " + xhr.responseText, true);
      }
    };

    xhr.onerror = function () {
      sendBtn.disabled = false;
      setStatus("Connection bondho hoyeche. Code, Wi-Fi ba receiver-er approval check korun.", true);
    };

    xhr.send(file);
  });
})();
</script>
</body>
</html>
