name: xendora
description: XENDORA - Universal File Transfer Ecosystem. Share Beyond Limits.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.7.4
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  share_plus: ^7.2.1
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.2
  uuid: ^4.2.2
  intl: ^0.18.1
  mime: ^1.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Xendora
      fonts:
        - asset: assets/fonts/Xendora-Regular.ttf
        - asset: assets/fonts/Xendora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Xendora-Bold.ttf
          weight: 700